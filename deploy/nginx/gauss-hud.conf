# Gauss HUD behind an nginx reverse proxy. Replace car.example.com with your subdomain.
# Any other HTTPS reverse proxy works too: forward everything to gauss-hud:3000 with the headers below.
#
# PASTE into your nginx config ONLY after:
#   1. the subdomain is in the server_name of your port 80 block (below) and nginx is reloaded;
#   2. certbot certonly --webroot -w /var/www/certbot -d car.example.com (the certificate must exist);
#   3. docker compose up -d gauss-hud (nginx refuses to load an upstream it cannot resolve).
# Then: docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
#
# Port 80 block: certbot gets ONLY /.well-known/acme-challenge/. Everything else redirects to HTTPS,
# where /.well-known/appspecific/ must reach the app, or the vehicle API cannot fetch the public key.
#
#   server {
#       listen 80;
#       server_name ... car.example.com;
#       location /.well-known/acme-challenge/ { root /var/www/certbot; }
#       location / { return 301 https://$host$request_uri; }
#   }

server {
    listen 443 ssl;
    server_name car.example.com;

    ssl_certificate /etc/letsencrypt/live/car.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/car.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The API only takes small JSON bodies.
    client_max_body_size 16k;

    # Everything to the app, path untouched (NO trailing slash on proxy_pass): the API is under /api/,
    # the public key under /.well-known/appspecific/, and the HUD is the rest.
    location / {
        proxy_pass http://gauss-hud:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app trusts these (TRUST_PROXY=true in the image): real IP for rate limits and the journal.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
